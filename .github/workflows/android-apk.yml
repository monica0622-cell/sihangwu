name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: winged-wardrobe-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare release APK
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/WingedWardrobe-debug.apk

      - name: Publish debug APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view android-debug >/dev/null 2>&1; then
            gh release upload android-debug release/WingedWardrobe-debug.apk --clobber
          else
            gh release create android-debug release/WingedWardrobe-debug.apk \
              --title "Winged Wardrobe Android Debug APK" \
              --notes "Android debug install package for testing Winged Wardrobe. Download the APK on an Android phone and allow installation from browser/files when prompted."
          fi
