services:
  - type: web
    name: smart-wardrobe
    runtime: docker
    healthCheckPath: /api/health
    disk:
      name: wardrobe-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: /var/data/data
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: UPLOAD_LIMIT_MB
        value: 12
      - key: ADMIN_PASSWORD
        generateValue: true
